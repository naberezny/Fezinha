# nginx do container "web": serve o app Angular e repassa a API. HTTPS fica com o proxy do servidor (aaPanel).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # API (mesma origem do app: o build de produção usa urlApi vazio).
  location ~ ^/(loterias|saude)(/|$) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # A primeira leitura do dia pode sincronizar com a Caixa antes de responder.
    proxy_read_timeout 120s;
  }

  # Arquivos que precisam ser revalidados sempre (atualização do app e do service worker).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
    add_header Cache-Control "no-cache";
  }
  # O mime.types do nginx não conhece .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Arquivos com hash no nome (main-F4DABCUC.js, chunk-B6D7_Ad4.js, styles-MXDK7LG7.css): cache longo.
  location ~ "-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas do app (/:loteria/gerar...) caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
