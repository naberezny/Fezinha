<header class="topbar" [class.so-desktop]="jogo()">
  <div class="in">
    <a class="brand" routerLink="/" aria-label="Sorteios, ir para a tela inicial">
      <span class="mark" aria-hidden="true">06</span>Sorteios
    </a>
    @if (jogo(); as atual) {
      <span class="jogo" data-teste="jogo-nome">{{ atual.nome }}</span>
      <nav aria-label="Principal">
        <a [routerLink]="['/', atual.id, 'gerar']" routerLinkActive="ativo">Gerar</a>
        <a [routerLink]="['/', atual.id, 'resultados']" routerLinkActive="ativo">Resultados</a>
        <a [routerLink]="['/', atual.id, 'estatisticas']" routerLinkActive="ativo">Estatísticas</a>
        <a [routerLink]="['/', atual.id, 'teste']" routerLinkActive="ativo">Teste</a>
      </nav>
    }
    <button
      type="button"
      class="tema"
      [attr.aria-label]="tema.rotuloAlternar()"
      [title]="tema.rotuloAlternar()"
      (click)="tema.alternar()"
    >
      <ion-icon [name]="tema.iconeAlternar()" />
    </button>
  </div>
</header>
